<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registre de Nou Client - Nothingan Pri</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">

    <div class="register-page">
        
        <!-- Logo en la esquina superior izquierda -->
        <div class="mb-3">
            <img th:src="@{/img/logo.png}" alt="Nothingan Pri" class="top-logo" />
        </div>

        <!-- Título centrado -->
        <h1 class="page-title">Registre de nou client</h1>

        <!-- Mensajes de error del backend -->
        <div th:if="${error}" class="info-box" style="background-color: #fee2e2; color: #991b1b; max-width: 1100px; margin: 0 auto 20px auto;" role="alert" th:text="${error}">
            S'ha produït un error en el registre.
        </div>

        <form th:action="@{/web/usuaris/registre}" th:object="${usuari}" method="post">
            <div class="register-grid">
                
                <!-- Columna Izquierda: Formulario principal -->
                <div class="form-fields-grid">
                    <div class="field-group">
                        <label for="nom">Nom complet</label>
                        <input type="text" id="nom" th:field="*{nom}" placeholder="Denis Navio Serrano" required />
                    </div>

                    <div class="field-group">
                        <label for="dni">Número d'identificació</label>
                        <input type="text" id="dni" th:field="*{dni}" placeholder="12345678A" required />
                    </div>

                    <div class="field-group">
                        <label for="dataCaducitatDni">Caducitat del document</label>
                        <input type="date" id="dataCaducitatDni" th:field="*{dataCaducitatDni}" required />
                    </div>

                    <div class="field-group">
                        <label for="tipusLlicencia">Tipus de llicència</label>
                        <input type="text" id="tipusLlicencia" th:field="*{tipusLlicencia}" placeholder="B" />
                    </div>

                    <div class="field-group">
                        <label for="dataCaducitatLlicencia">Caducitat de la llicència</label>
                        <input type="date" id="dataCaducitatLlicencia" th:field="*{dataCaducitatLlicencia}" />
                    </div>

                    <div class="field-group">
                        <label for="telefon">Telèfon</label>
                        <input type="tel" id="telefon" th:field="*{telefon}" placeholder="600 000 000" required />
                    </div>

                    <div class="field-group">
                        <label for="targetaCredit">Número targeta de crèdit</label>
                        <input type="text" id="targetaCredit" th:field="*{targetaCredit}" placeholder="•••• •••• •••• ••••" />
                    </div>

                    <div class="field-group">
                        <label for="adreca">Adreça del domicili</label>
                        <input type="text" id="adreca" th:field="*{adreca}" placeholder="C/ Major 1, Terrassa" />
                    </div>

                    <div class="field-group">
                        <label for="nacionalitat">Nacionalitat</label>
                        <input type="text" id="nacionalitat" th:field="*{nacionalitat}" placeholder="Espanyola" />
                    </div>

                    <div class="field-group">
                        <label for="email">Email (usuari)</label>
                        <input type="email" id="email" th:field="*{email}" placeholder="dnavio@alumnat.copernic.cat" required />
                    </div>

                    <div class="field-group">
                        <label for="password">Contrasenya</label>
                        <input type="password" id="password" th:field="*{password}" placeholder="••••••••" required />
                    </div>
                </div>

                <!-- Columna Derecha: Panel de información y acciones -->
                <div class="right-panel">
                    <div class="info-box">
                        Un cop enviat, el registre quedarà en estat Pendent d'aprovació.
                    </div>

                    <div class="action-buttons">
                        <button type="submit" class="btn-blue-fill">Enviar sol·licitud</button>
                        <a th:href="@{/web/usuaris/login}" class="btn-outline-cancel">Cancel·lar</a>
                    </div>
                </div>

            </div>
        </form>

    </div>

</body>
</html>
