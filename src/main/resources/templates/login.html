<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inici de Sessió</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card shadow-sm p-4" style="width: 100%; max-width: 420px;">
        <h3 class="text-center mb-4 text-primary">Inici de Sessió</h3>

        <!-- Formulari de Login -->
        <form th:action="@{/web/usuaris/login}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="nom@exemple.com" required />
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Contrasenya</label>
                <input type="password" id="password" name="password" class="form-control" required />
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3">Iniciar Sessió</button>

            <div class="text-center mb-3">
                <span class="text-muted">No tens un compte?</span>
                <a th:href="@{/web/usuaris/registre}" class="text-decoration-none">Registra't</a>
            </div>
        </form>

        <!-- Missatges d'Error (alerta si credencials incorrectes) -->
        <div th:if="${error}" class="alert alert-danger mb-2" role="alert" th:text="${error}">
            Credencials incorrectes.
        </div>

        <!-- Missatges d'Avís a Baix (Quan ve de enviar el registre) -->
        <div th:if="${param.registrePendent}" class="alert alert-info mt-3 mb-0 text-center" role="alert">
            La teva sol·licitud s'ha enviat correctament! Està pendent de revisió per un agent.
        </div>

        <div th:if="${alertaPendent}" class="alert alert-warning mt-3 mb-0 text-center" role="alert" th:text="${alertaPendent}">
            El teu usuari encara no està validat per un agent.
        </div>
    </div>

</body>
</html>
