<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inicia sessió - Nothingan Pri</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">

    <div class="login-wrapper">
        <div class="login-card">
            
            <!-- Logotip -->
            <img th:src="@{/img/logo.png}" alt="Nothingan Pri" class="login-logo" />

            <p class="login-title">Inicia sessió</p>

            <!-- Formulari de Login -->
            <form th:action="@{/web/usuaris/login}" method="post">
                <div class="form-group-login">
                    <label for="email">Email (usuari)</label>
                    <input type="email" id="email" name="email" placeholder="dnavio@alumnat.copernic.cat" required />
                </div>

                <div class="form-group-login">
                    <label for="password">Contrasenya</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required />
                </div>

                <button type="submit" class="btn-primary-full">Entrar</button>

                <div class="login-links">
                    <a th:href="@{/web/usuaris/registre}" class="link-blue">No tens compte? Registra't</a>
                    <a href="#" class="link-subtle">Has oblidat la contrasenya?</a>
                </div>
            </form>

            <!-- Missatges d'Error (si les credencials són incorrectes) -->
            <div th:if="${error}" class="info-box" style="background-color: #fee2e2; color: #991b1b; margin-top: 20px;" role="alert" th:text="${error}">
                Credencials incorrectes.
            </div>

            <!-- Missatges d'Avís (quan ve d'enviar el registre) -->
            <div th:if="${param.registrePendent}" class="info-box" style="margin-top: 20px;" role="alert">
                La teva sol·licitud s'ha enviat correctament! Està pendent de revisió per un agent.
            </div>

            <div th:if="${alertaPendent}" class="info-box" style="background-color: #fef3c7; color: #92400e; margin-top: 20px;" role="alert" th:text="${alertaPendent}">
                El teu usuari encara no està validat per un agent.
            </div>

        </div>
    </div>

</body>
</html>
