<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestió de vehicles - Nothingan Pri</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="layout">

    <aside class="sidebar">
        <div class="logo-container">
            <img th:src="@{/img/logo.png}"
                 alt="Nothingan Pri" class="logo">
        </div>

        <nav class="nav-menu">
            <a th:href="@{/web/reserves/all}">• Reserves</a>
            <a th:href="@{/web/vehicles/all}" class="active">• Vehicles</a>
            <a th:href="@{/web/usuaris/all}">• Clients</a>
        </nav>
    </aside>

    <main class="content">

        <header class="top-header">
            <h2>Gestió de vehicles</h2>

            <div class="user-dropdown">
                <span>(agent) ▾</span>
                <div class="user-avatar"></div>
            </div>
        </header>

        <div th:if="${missatge}"
             class="alert-success"
             th:text="${missatge}"></div>

        <div th:if="${error}"
             class="alert-error"
             th:text="${error}"></div>

        <div class="top-bar">
            <h3>Llistat de vehicles</h3>

            <a th:href="@{/web/vehicles/new}" class="btn btn-add">
                + Nou vehicle
            </a>
        </div>

        <!-- Filtre per matrícula -->
        <div class="table-card" style="padding: 20px; margin-bottom: 20px;">
            <form th:action="@{/web/vehicles/all}" method="get">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="matricula">Matrícula del vehicle</label>
                        <input type="text"
                               id="matricula"
                               name="matricula"
                               placeholder="Introdueix la matrícula"
                               th:value="${matricula}">
                    </div>
                </div>

                <div class="button-group" style="margin-top: 15px;">
                    <button type="submit" class="btn btn-filter">
                        Filtrar
                    </button>

                    <!-- Botó per netejar el filtre -->
                    <a th:href="@{/web/vehicles/all}" class="btn btn-cancel">
                        Netejar filtres
                    </a>
                </div>

            </form>
        </div>

        <!-- Taula de vehicles -->
        <div class="table-card">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Matrícula</th>
                        <th>Marca</th>
                        <th>Model</th>
                        <th>Categoria</th>
                        <th>Preu/Dia</th>
                        <th>Estat</th>
                        <th>Accions</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="v : ${vehicle}">
                        <td th:text="${v.matricula != null ? v.matricula : '-'}"></td>
                        <td th:text="${v.marca != null ? v.marca : '-'}"></td>
                        <td th:text="${v.model != null ? v.model : '-'}"></td>
                        <td th:text="${v.categoria != null ? v.categoria : '-'}"></td>
                        
                        <td>
                            <span th:if="${v.preuDia != null}"
                                  th:text="${#numbers.formatDecimal(v.preuDia, 1, 2) + ' €'}"></span>
                            <span th:unless="${v.preuDia != null}">-</span>
                        </td>

                        <td>
                            <span class="badge"
                                  th:classappend="${v.estatVehicle != null and v.estatVehicle.name() == 'Disponible'} ? ' badge-validat' : ' badge-rebutjat'"
                                  th:text="${v.estatVehicle != null ? v.estatVehicle : '-'}"></span>
                        </td>

                        <td class="actions-cell">
                            <a th:href="@{/web/vehicles/edit/{id}(id=${v.id})}">
                                Editar
                            </a>

                            <form th:action="@{/web/vehicles/delete/{id}(id=${v.id})}"
                                  method="get"
                                  style="display: inline;"
                                  onsubmit="return confirm('Segur que vols eliminar aquest vehicle?');">
                                <button type="submit" class="action-link" style="color: red; border: none; background: none; cursor: pointer;">
                                    Eliminar
                                </button>
                            </form>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(vehicle)}">
                        <td colspan="7" class="empty-state">
                            No s'han trobat vehicles.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>
</div>

</body>
</html>
