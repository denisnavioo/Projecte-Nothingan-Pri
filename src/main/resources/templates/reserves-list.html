<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestió de reserves - Nothingan Pri</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- Estructura principal de la página. -->
<div class="layout">

    <!-- Menú lateral de navegación. -->
    <aside class="sidebar">
        <div class="logo-container">
            <img th:src="@{/img/logo.png}" alt="Nothingan Pri" class="logo">
        </div>

        <nav class="nav-menu">
            <a th:href="@{/web/reserves/all}" class="active">• Reserves</a>
            <a th:href="@{/web/vehicles/all}">• Vehicles</a>
            <a th:href="@{/web/usuaris/all}">• Clients</a>
        </nav>
    </aside>

    <!-- Contenido principal de la página. -->
    <main class="content">

        <!-- Cabecera con el título y el usuario. -->
        <header class="top-header">
            <h2>Gestió de reserves</h2>
            <div class="user-dropdown">
                <span>(agent) ▾</span>
                <div class="user-avatar"></div>
            </div>
        </header>

        <!-- Mensajes de éxito y error. -->
        <div th:if="${missatge}" class="alert-success" th:text="${missatge}"></div>
        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <!-- Título y botón para crear una reserva. -->
        <div class="top-bar">
            <h3>Llistat de reserves</h3>
            <a th:href="@{/web/reserves/new}" class="btn btn-add">
                + Nova reserva
            </a>
        </div>

        <!-- RF42: filtros para buscar reservas. -->
        <div class="table-card" style="padding: 20px; margin-bottom: 20px;">
            <form th:action="@{/web/reserves/all}" method="get">
                <div class="form-grid">

                    <!-- Filtro por DNI del cliente. -->
                    <div class="form-group">
                        <label for="dni">DNI del client</label>
                        <input type="text" id="dni" name="dni"
                               placeholder="Introdueix el DNI" th:value="${dni}">
                    </div>

                    <!-- Filtro por código de reserva. -->
                    <div class="form-group">
                        <label for="codi">Codi de reserva</label>
                        <input type="text" id="codi" name="codi"
                               placeholder="Codi de reserva" th:value="${codi}">
                    </div>

                    <!-- Filtro por matrícula del vehículo. -->
                    <div class="form-group">
                        <label for="matricula">Matrícula del vehicle</label>
                        <input type="text" id="matricula" name="matricula"
                               placeholder="Introdueix la matrícula" th:value="${matricula}">
                    </div>

                    <!-- Filtro por fecha de reserva. -->
                    <div class="form-group">
                        <label for="data">Data de reserva</label>
                        <input type="date" id="data" name="data"
                               th:value="${data}">
                    </div>

                </div>

                <!-- Botones para aplicar o limpiar los filtros. -->
                <div class="button-group" style="margin-top: 15px;">
                    <button type="submit" class="btn btn-filter">Filtrar</button>
                    <a th:href="@{/web/reserves/all}" class="btn btn-cancel">
                        Netejar filtres
                    </a>
                </div>
            </form>
        </div>

        <!-- RF40: tabla con el listado de reservas. -->
        <div class="table-card">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Codi</th>
                        <th>Client</th>
                        <th>Vehicle</th>
                        <th>Data inici</th>
                        <th>Data fi</th>
                        <th>Preu</th>
                        <th>Estat</th>
                        <th>Accions</th>
                    </tr>
                </thead>

                <tbody>
                    <!-- Muestra los datos de cada reserva. -->
                    <tr th:each="r : ${reserves}">
                        <td th:text="${r.codiReserva != null ? r.codiReserva : '-'}"></td>
                        <td th:text="${r.usuari != null ? r.usuari.nom : '-'}"></td>
                        <td th:text="${r.vehicle != null ? r.vehicle.matricula : '-'}"></td>

                        <td th:text="${r.dataInici != null ? #temporals.format(r.dataInici, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                        <td th:text="${r.dataFi != null ? #temporals.format(r.dataFi, 'dd/MM/yyyy HH:mm') : '-'}"></td>

                        <!-- Muestra el precio del alquiler. -->
                        <td>
                            <span th:if="${r.preuLloguer != null}"
                                  th:text="${#numbers.formatDecimal(r.preuLloguer, 1, 2) + ' €'}"></span>
                            <span th:unless="${r.preuLloguer != null}">-</span>
                        </td>

                        <!-- Muestra el estado con su estilo correspondiente. -->
                        <td>
                            <span class="badge"
                                  th:classappend="${r.estat != null and r.estat.name() == 'Confirmada'} ? ' badge-validat' : (${r.estat != null and r.estat.name() == 'Anulada'} ? ' badge-rebutjat' : ' badge-baixa')"
                                  th:text="${r.estat != null ? r.estat : '-'}"></span>
                        </td>

                        <!-- Acciones disponibles para cada reserva. -->
                        <td class="actions-cell">
                            
                            <!-- Abre los detalles conservando los filtros. -->
                            <a th:href="@{/web/reserves/detall/{id}(
                                id=${r.id},
                                dni=${dni},
                                codi=${codi},
                                matricula=${matricula},
                                data=${data}
                            )}">
                                Veure
                            </a>

                            <!-- Permite anular reservas que todavía se pueden cancelar. -->
                            <form th:if="${r.estat != null and r.estat.name() != 'Anulada' and r.estat.name() != 'Lliurada'}"
                                  th:action="@{/web/reserves/cancelar/{id}(id=${r.id})}"
                                  method="post"
                                  style="display: inline;"
                                  onsubmit="return confirm('Segur que vols anul·lar aquesta reserva?');">
                                <button type="submit" class="action-link">Anul·lar</button>
                            </form>
                        </td>
                    </tr>

                    <!-- Mensaje cuando no hay reservas para mostrar. -->
                    <tr th:if="${#lists.isEmpty(reserves)}">
                        <td colspan="8" class="empty-state">
                            No s'han trobat reserves.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- RF41: detalles de la reserva seleccionada. -->
        <div th:if="${reservaSeleccionada != null}"
             class="table-card" style="padding: 24px; margin-top: 20px;">

            <div class="top-bar">
                <h3>Detalls de la reserva</h3>
                
                <!-- Cierra los detalles conservando los filtros. -->
                <a th:href="@{/web/reserves/all(
                    dni=${dni},
                    codi=${codi},
                    matricula=${matricula},
                    data=${data}
                )}" class="btn btn-cancel">Tancar</a>
            </div>

            <div class="form-grid">

                <!-- Muestra el código de reserva. -->
                <div class="form-group">
                    <label>Codi de reserva</label>
                    <p th:text="${reservaSeleccionada.codiReserva}"></p>
                </div>

                <!-- Datos del cliente. -->
                <div class="form-group">
                    <label>Client</label>
                    <p th:text="${reservaSeleccionada.usuari != null ? reservaSeleccionada.usuari.nom : '-'}"></p>
                </div>

                <div class="form-group">
                    <label>DNI del client</label>
                    <p th:text="${reservaSeleccionada.usuari != null ? reservaSeleccionada.usuari.dni : '-'}"></p>
                </div>

                <!-- Datos del vehículo. -->
                <div class="form-group">
                    <label>Vehicle</label>
                    <p th:text="${reservaSeleccionada.vehicle != null ? reservaSeleccionada.vehicle.matricula : '-'}"></p>
                </div>

                <!-- Fechas del alquiler. -->
                <div class="form-group">
                    <label>Data d'inici</label>
                    <p th:text="${reservaSeleccionada.dataInici != null ? #temporals.format(reservaSeleccionada.dataInici, 'dd/MM/yyyy HH:mm') : '-'}"></p>
                </div>

                <div class="form-group">
                    <label>Data de finalització</label>
                    <p th:text="${reservaSeleccionada.dataFi != null ? #temporals.format(reservaSeleccionada.dataFi, 'dd/MM/yyyy HH:mm') : '-'}"></p>
                </div>

                <!-- Importes de la reserva. -->
                <div class="form-group">
                    <label>Preu del lloguer</label>
                    <p th:text="${reservaSeleccionada.preuLloguer != null ? #numbers.formatDecimal(reservaSeleccionada.preuLloguer, 1, 2) + ' €' : '-'}"></p>
                </div>

                <div class="form-group">
                    <label>Fiança</label>
                    <p th:text="${reservaSeleccionada.importFianca != null ? #numbers.formatDecimal(reservaSeleccionada.importFianca, 1, 2) + ' €' : '-'}"></p>
                </div>

                <!-- Estado actual de la reserva. -->
                <div class="form-group">
                    <label>Estat</label>
                    <p th:text="${reservaSeleccionada.estat != null ? reservaSeleccionada.estat : '-'}"></p>
                </div>

                <!-- Observaciones registradas en la reserva. -->
                <div class="form-group">
                    <label>Observacions</label>
                    <p th:text="${reservaSeleccionada.observacions != null and !reservaSeleccionada.observacions.isEmpty() ? reservaSeleccionada.observacions : '-'}"></p>
                </div>
                
                <!-- Calcula y muestra el total del alquiler y la fianza. -->
                <div class="form-group">
                    <label>Total de la reserva</label>
                    <p th:text="${reservaSeleccionada.preuLloguer != null and reservaSeleccionada.importFianca != null
                        ? #numbers.formatDecimal(reservaSeleccionada.preuLloguer + reservaSeleccionada.importFianca, 1, 2) + ' €'
                        : '-'}"
                       style="font-weight: bold; color: #1d4ed8;"></p>
                </div>

            </div>
        </div>

    </main>
</div>

</body>
</html>
