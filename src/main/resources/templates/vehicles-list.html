<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestió de vehicles</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="d-flex">
        
        <!-- Menú Lateral Sidebar -->
        <div class="bg-dark text-white p-3 min-vh-100" style="width: 250px;">
            
            <div class="mb-4">
                <h4 class="text-white">Nothingan Pri</h4>
            </div>

            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="#" class="nav-link text-white">Reserves</a>
                </li>
                <li class="nav-item">
                    <!-- Opció activa per a Vehicles -->
                    <a th:href="@{/web/vehicles/all}" class="nav-link active">Vehicles</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link text-white">Clients</a>
                </li>
            </ul>

        </div>

        <!-- Contingut Principal -->
        <div class="flex-grow-1 bg-light">
            
            <!-- Barra Superior Navbar -->
            <div class="bg-white p-3 border-bottom d-flex justify-content-between align-items-center">
                <h2 class="h4 mb-0">Gestió de vehicles</h2>

                <div class="dropdown">
                    <button class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        Anna (agent)
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#">Tancar sessió</a></li>
                    </ul>
                </div>
            </div>

            <!-- Cos de la pàgina -->
            <div class="p-4">

                <!-- Barra de Filtre i Botó Alta -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    
                    <form class="d-flex gap-2" method="get" action="#">
                        <input type="text" class="form-control" placeholder="Filtrar per matrícula..." name="matricula">
                        <button type="submit" class="btn btn-outline-secondary">Filtrar</button>
                    </form>

                    <a th:href="@{/web/vehicles/new}" class="btn btn-primary">
                        + Alta de vehicle
                    </a>

                </div>

                <!-- Taula de Vehicles -->
                <div class="card shadow-sm">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0 align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Matrícula</th>
                                        <th>Marca / Model</th>
                                        <th>Categoria</th>
                                        <th>Any</th>
                                        <th>Preu / Dia</th>
                                        <th>Estat</th>
                                        <th>Actiu</th>
                                        <th class="text-end pe-4">Accions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    
                                    <!-- Iteració sobre la llista de vehicles (${vehicle}) -->
                                    <tr th:each="v : ${vehicle}">
                                        <td class="fw-bold" th:text="${v.matricula}">1234ABC</td>
                                        <td th:text="${v.marca + ' ' + v.model}">Seat Ibiza</td>
                                        <td>
                                            <span class="badge bg-secondary" th:text="${v.categoria}">SUV</span>
                                        </td>
                                        <td th:text="${v.anyFabricacio}">2022</td>
                                        <td th:text="${#numbers.formatDecimal(v.preuDia, 1, 2) + ' €'}">45.00 €</td>
                                        <td>
                                            <!-- Color dinàmic segons l'estat -->
                                            <span th:classappend="${v.estatVehicle.name() == 'Disponible' ? 'bg-success' : 'bg-warning'}" 
                                                  class="badge" 
                                                  th:text="${v.estatVehicle}">Disponible</span>
                                        </td>
                                        <td>
                                            <span th:if="${v.actiu}" class="badge bg-success">Sí</span>
                                            <span th:unless="${v.actiu}" class="badge bg-danger">No</span>
                                        </td>
                                        <td class="text-end pe-4">
                                            <a th:href="@{/web/vehicles/edit/{id}(id=${v.id})}" class="text-decoration-none me-1">Editar</a> ·
                                            <a th:href="@{/web/vehicles/delete/{id}(id=${v.id})}" 
                                               class="text-danger text-decoration-none ms-1"
                                               onclick="return confirm('Estàs segur que vols eliminar aquest vehicle?');">Baixa</a>
                                        </td>
                                    </tr>

                                    <!-- Missatge si no hi ha vehicles -->
                                    <tr th:if="${#lists.isEmpty(vehicle)}">
                                        <td colspan="8" class="text-center text-muted py-4">
                                            No s'han trobat vehicles registrats.
                                        </td>
                                    </tr>

                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS per al desplegable de l'usuari -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
