<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova reserva - Nothingan Pri</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="layout">

    <aside class="sidebar">
        <div class="logo-container">
            <img th:src="@{/img/logo.png}"
                 alt="Nothingan Pri" class="logo">
        </div>

        <nav class="nav-menu">
            <a th:href="@{/web/reserves/all}" class="active">• Reserves</a>
            <a th:href="@{/web/vehicles/all}">• Vehicles</a>
            <a th:href="@{/web/usuaris/all}">• Clients</a>
        </nav>
    </aside>

    <main class="content">

        <header class="top-header">
            <h2>Gestió de reserves</h2>

            <div class="user-dropdown">
                <span>(agent) ▾</span>
                <div class="user-avatar"></div>
            </div>
        </header>

        <div class="top-bar">
            <h3>Nova reserva</h3>

            <a th:href="@{/web/reserves/all}"
               class="btn btn-cancel">
                Tornar al llistat
            </a>
        </div>

        <div th:if="${error}"
             class="alert-error"
             th:text="${error}"></div>

        <div class="table-card" style="padding: 24px;">

            <form th:action="@{/web/reserves/save}"
                  th:object="${reserva}"
                  method="post">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="vehicle">Vehicle</label>
                        <select id="vehicle" name="vehicle.id" required>
                            <option value="" selected disabled>
                                Selecciona un vehicle...
                            </option>
                            <option th:each="v : ${vehicles}"
                                    th:value="${v.id}"
                                    th:text="${v.matricula + ' - ' + v.marca + ' ' + v.model + ' (' + v.estatVehicle + ')'}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="usuari">Client</label>
                        <select id="usuari" name="usuari.id" required>
                            <option value="" selected disabled>
                                Selecciona un client...
                            </option>
                            <option th:each="u : ${usuaris}"
                                    th:value="${u.id}"
                                    th:text="${u.nom + ' - ' + u.dni + ' (' + u.estatRegistre + ')'}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="dataInici">Data i hora d'inici</label>
                        <input type="datetime-local"
                               id="dataInici"
                               th:field="*{dataInici}"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="dataFi">Data i hora de finalització</label>
                        <input type="datetime-local"
                               id="dataFi"
                               th:field="*{dataFi}"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="importFianca">Import de la fiança (€)</label>
                        <input type="number"
                               id="importFianca"
                               th:field="*{importFianca}"
                               min="0"
                               step="0.01"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="observacions">Observacions</label>
                        <textarea id="observacions"
                                  th:field="*{observacions}"
                                  rows="3"
                                  maxlength="1000"></textarea>
                    </div>

                </div>

                <div class="button-group" style="margin-top: 24px;">
                    <button type="submit" class="btn btn-filter">
                        Desar reserva
                    </button>

                    <a th:href="@{/web/reserves/all}"
                       class="btn btn-cancel">
                        Cancel·lar
                    </a>
                </div>

            </form>

        </div>

    </main>
</div>

</body>
</html>
