<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulari Vehicle - Nothingan Pri</title>
        <link rel="stylesheet" th:href="@{/css/styles.css}">
    </head>
    <body>

        <div class="layout">

            <aside class="sidebar">
                <div class="logo-container">
                    <a th:href="@{/web/usuaris/login}">
                        <img th:src="@{/img/logo.png}" alt="Nothingan Pri" class="logo">
                    </a>                 alt="Nothingan Pri" class="logo">
                </div>

                <nav class="nav-menu">
                    <a th:href="@{/web/reserves/all}">• Reserves</a>
                    <a th:href="@{/web/vehicles/all}" class="active">• Vehicles</a>
                    <a th:href="@{/web/usuaris/all}">• Clients</a>
                </nav>
            </aside>

            <main class="content">

                <header class="top-header">
                    <h2>Gestió de vehicles</h2>

                    <div class="user-dropdown">
                        <span>(agent) ▾</span>
                        <div class="user-avatar"></div>
                    </div>
                </header>

                <div class="top-bar">
                    <h3>Formulari Vehicle</h3>

                    <a th:href="@{/web/vehicles/all}"
                       class="btn btn-cancel">
                        Tornar al llistat
                    </a>
                </div>

                <div th:if="${error}"
                     class="alert-error"
                     th:text="${error}"></div>

                <div class="table-card" style="padding: 24px;">

                    <form th:action="@{/web/vehicles/save}"
                          th:object="${vehicle}"
                          method="post">

                        <!-- Camp ocult per a l'ID -->
                        <input type="hidden" th:field="*{id}" />

                        <div class="form-grid">

                            <div class="form-group">
                                <label for="matricula">Matrícula</label>
                                <input type="text"
                                       id="matricula"
                                       th:field="*{matricula}"
                                       maxlength="15"
                                       required>
                            </div>

                            <div class="form-group">
                                <label for="marca">Marca</label>
                                <input type="text"
                                       id="marca"
                                       th:field="*{marca}"
                                       maxlength="50"
                                       required>
                            </div>

                            <div class="form-group">
                                <label for="model">Model</label>
                                <input type="text"
                                       id="model"
                                       th:field="*{model}"
                                       maxlength="50"
                                       required>
                            </div>

                            <div class="form-group">
                                <label for="anyFabricacio">Any de Fabricació</label>
                                <input type="number"
                                       id="anyFabricacio"
                                       th:field="*{anyFabricacio}"
                                       min="1900"
                                       max="2099"
                                       required>
                            </div>

                            <div class="form-group">
                                <label for="categoria">Categoria</label>
                                <select id="categoria" th:field="*{categoria}" required>
                                    <option value="" selected disabled>Selecciona una categoria...</option>
                                    <option th:each="cat : ${T(cat.copernic.Projecte1.entity.Enum.Categoria).values()}" 
                                            th:value="${cat}" 
                                            th:text="${cat}">SUV</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="preuDia">Preu per Dia (€)</label>
                                <input type="number"
                                       id="preuDia"
                                       th:field="*{preuDia}"
                                       step="0.01"
                                       min="0"
                                       max="999.99"
                                       required>
                            </div>

                            <div class="form-group">
                                <label for="estatVehicle">Estat del Vehicle</label>
                                <select id="estatVehicle" th:field="*{estatVehicle}" required>
                                    <option th:each="estat : ${T(cat.copernic.Projecte1.entity.Enum.EstatVehicle).values()}" 
                                            th:value="${estat}" 
                                            th:text="${estat}">Disponible</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="fotoVehicle">Ruta / Nom de la Foto</label>
                                <input type="text"
                                       id="fotoVehicle"
                                       th:field="*{fotoVehicle}"
                                       maxlength="255"
                                       placeholder="ej: cotxe1.jpg">
                            </div>

                            <div class="form-group" style="grid-column: span 2;">
                                <label for="actiu" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                    <input type="checkbox"
                                           id="actiu"
                                           th:field="*{actiu}"
                                           style="width: auto;">
                                    <strong>Vehicle Actiu</strong>
                                </label>
                            </div>

                        </div>

                        <div class="button-group" style="margin-top: 24px;">
                            <button type="submit" class="btn btn-filter">
                                Desar vehicle
                            </button>

                            <a th:href="@{/web/vehicles/all}"
                               class="btn btn-cancel">
                                Cancel·lar
                            </a>
                        </div>

                    </form>

                </div>

            </main>
        </div>

    </body>
</html>
