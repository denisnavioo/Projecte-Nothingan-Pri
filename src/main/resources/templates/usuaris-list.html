<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestió de Clients</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <div class="d-flex" style="min-height: 100vh;">
        <!-- Menú Lateral Esquerre -->
        <div class="bg-dark text-white p-3" style="width: 250px;">
            <h4 class="mb-4">Projecte 1</h4>
            <ul class="nav flex-column gap-2">
                <li class="nav-item"><a th:href="@{/web/vehicles/all}" class="nav-link text-white-50">• Vehicles</a></li>
                <li class="nav-item"><a th:href="@{/web/reserves/all}" class="nav-link text-white-50">• Reserves</a></li>
                <li class="nav-item"><a th:href="@{/web/usuaris/all}" class="nav-link text-white fw-bold">• Clients</a></li>
            </ul>
        </div>

        <!-- Contingut Principal -->
        <div class="flex-grow-1 p-4">
            <!-- Capçalera superior -->
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
                <h2>Gestió de clients</h2>
                <div class="text-muted">(agent) ▾</div>
            </div>

            <!-- Cercador i botó Alta -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <form class="d-flex gap-2" method="get" th:action="@{/web/usuaris/all}">
                    <input type="text" name="dni" class="form-control" placeholder="Filtrar per DNI" />
                    <button type="submit" class="btn btn-outline-secondary">Filtrar</button>
                </form>

                <a th:href="@{/web/usuaris/new}" class="btn btn-success">+ Alta de client</a>
            </div>

            <!-- Taula d'usuaris -->
            <div class="card shadow-sm">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Nom</th>
                            <th>DNI</th>
                            <th>Telèfon</th>
                            <th>Email</th>
                            <th>Registre</th>
                            <th>Accions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${usuaris}">
                            <td>
                                <span th:text="${u.nom}">Nom</span>
                                <!-- Badge opcional per mostrar si és Premium (RF21/RF22) -->
                                <span th:if="${u.premium}" class="badge bg-warning text-dark ms-1">★ Premium</span>
                            </td>
                            <td th:text="${u.dni}">DNI</td>
                            <td th:text="${u.telefon}">Telèfon</td>
                            <td th:text="${u.email}">Email</td>
                            
                            <!-- Columna Registre amb etiquetes de colors segons l'estat -->
                            <td>
                                <span class="badge" 
                                      th:classappend="${u.estatRegistre == 'VALIDAT' ? 'bg-success' : (u.estatRegistre == 'PENDENT' ? 'bg-warning text-dark' : 'bg-danger')}"
                                      th:text="${u.estatRegistre != null ? u.estatRegistre : 'PENDENT'}">
                                    PENDENT
                                </span>
                            </td>
                            
                            <td>
                                <a th:href="@{/web/usuaris/edit/{id}(id=${u.id})}" class="btn btn-sm btn-link text-decoration-none">Editar</a>
                                <a th:href="@{/web/usuaris/delete/{id}(id=${u.id})}" class="btn btn-sm btn-link text-danger text-decoration-none" onclick="return confirm('Segur que vols donar de baixa aquest usuari?')">Baixa</a>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(usuaris)}">
                            <td colspan="6" class="text-center text-muted py-4">No s'han trobat clients registrats.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
