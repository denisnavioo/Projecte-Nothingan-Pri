<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestió de Clients - Nothingan Pri</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <div class="layout">
        
        <!-- Sidebar lateral -->
        <aside class="sidebar">
            <div class="logo-container">
                <img th:src="@{/img/logo.png}" alt="Nothingan Pri" class="logo" />
            </div>
            
            <nav class="nav-menu">
                <a href="#">● Reserves</a>
                <a href="#">● Vehicles</a>
                <a th:href="@{/web/usuaris/all}" class="active">● Clients</a>
            </nav>
        </aside>

        <!-- Contenido principal -->
        <main class="content">
            
            <!-- Cabecera superior -->
            <header class="top-header">
                <h2>Gestió de clients</h2>
                <div class="user-dropdown">
                    <span>Anna (agent) ▾</span>
                    <div class="user-avatar"></div>
                </div>
            </header>

            <!-- Barra de Filtro y Botón Alta -->
            <div class="top-bar">
                <form th:action="@{/web/usuaris/all}" method="get" class="filter-group">
                    <div class="input-wrapper">
                        <label for="filterDni">Filtrar per DNI</label>
                        <input type="text" id="filterDni" name="dni" th:value="${dniFiltre}" placeholder="12345678A" />
                    </div>
                    <button class="btn btn-filter" type="submit">Filtrar</button>
                    
                    <!-- Botón para limpiar filtro cuando hay un DNI buscado -->
                    <a th:if="${dniFiltre != null and !dniFiltre.empty}" th:href="@{/web/usuaris/all}" class="btn btn-cancel" style="padding: 10px 14px; text-decoration: none;">Netejar</a>
                </form>

                <a th:href="@{/web/usuaris/new}" class="btn btn-add">+ Alta de client</a>
            </div>

            <!-- Tabla de Clientes -->
            <div class="table-card">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Nom</th>
                            <th>DNI</th>
                            <th>Telèfon</th>
                            <th>Email</th>
                            <th>Registre</th>
                            <th>Accions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${usuaris}">
                            <td th:text="${u.nom}">Denis Navio</td>
                            <td th:text="${u.dni}">12345678A</td>
                            <td th:text="${u.telefon}">600000000</td>
                            <td th:text="${u.email}">dnavio@alumnat.copernic.cat</td>
                            <td>
                                <!-- Mapeo visual de badges según el estado -->
                                <span th:if="${u.estatRegistre == 'VALIDAT' or u.estatRegistre == 'ACCEPTAT'}" class="badge badge-validat">Validat</span>
                                <span th:if="${u.estatRegistre == 'PENDENT' or u.estatRegistre == null}" class="badge badge-pendent">Pendent</span>
                                <span th:if="${u.estatRegistre == 'REBUTJAT'}" class="badge badge-rebutjat">Rebutjat</span>
                                <span th:if="${u.estatRegistre == 'BAIXA'}" class="badge badge-baixa">Baixa</span>
                            </td>
                            <td class="actions-cell">
                                <a th:href="@{/web/usuaris/edit/{id}(id=${u.id})}">Veure</a> · 
                                <a th:href="@{/web/usuaris/edit/{id}(id=${u.id})}">Editar</a> · 
                                <a th:href="@{/web/usuaris/delete/{id}(id=${u.id})}" onclick="return confirm('Estàs segur de donar de baixa aquest client?')">Baixa</a>
                            </td>
                        </tr>
                        
                        <!-- Estado vacío si no hay usuarios en la lista -->
                        <tr th:if="${#lists.isEmpty(usuaris)}">
                            <td colspan="6" class="empty-state">No s'han trobat clients registrats.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </main>
    </div>

</body>
</html>
