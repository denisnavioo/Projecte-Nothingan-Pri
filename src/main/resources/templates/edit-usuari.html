<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulari Client - Nothingan Pri</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="layout">

    <aside class="sidebar">
        <div class="logo-container">
            <img th:src="@{/img/logo.png}"
                 alt="Nothingan Pri" class="logo">
        </div>

        <nav class="nav-menu">
            <a th:href="@{/web/reserves/all}">• Reserves</a>
            <a th:href="@{/web/vehicles/all}">• Vehicles</a>
            <a th:href="@{/web/usuaris/all}" class="active">• Clients</a>
        </nav>
    </aside>

    <main class="content">

        <header class="top-header">
            <h2>Gestió de clients</h2>

            <div class="user-dropdown">
                <span>(agent) ▾</span>
                <div class="user-avatar"></div>
            </div>
        </header>

        <div class="top-bar">
            <h3>Formulari Client</h3>

            <a th:href="@{/web/usuaris/all}"
               class="btn btn-cancel">
                Tornar al llistat
            </a>
        </div>

        <div th:if="${error}"
             class="alert-error"
             th:text="${error}"></div>

        <div class="table-card" style="padding: 24px;">

            <!-- Formulari connectat amb Spring Boot -->
            <form th:action="@{/web/usuaris/save}"
                  th:object="${usuari}"
                  method="post">

                <!-- ID ocult per saber si creem o editem -->
                <input type="hidden" th:field="*{id}" />

                <div class="form-grid">

                    <div class="form-group">
                        <label for="nom">Nom complet</label>
                        <input type="text"
                               id="nom"
                               th:field="*{nom}"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="dni">DNI / NIE</label>
                        <input type="text"
                               id="dni"
                               th:field="*{dni}"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="telefon">Telèfon</label>
                        <input type="tel"
                               id="telefon"
                               th:field="*{telefon}">
                    </div>

                    <div class="form-group">
                        <label for="email">Email (Usuari)</label>
                        <input type="email"
                               id="email"
                               th:field="*{email}"
                               required>
                    </div>

                    <!-- Secció Gestió de l'Estat del Registre (RF12/RF13) -->
                    <div class="form-group">
                        <label for="estatRegistre">Estat del Registre (RF12/RF13)</label>
                        <select id="estatRegistre" th:field="*{estatRegistre}">
                            <option value="PENDENT">PENDENT (Pendent de revisió)</option>
                            <option value="VALIDAT">VALIDAT (Aprovat / Donat d'alta)</option>
                            <option value="REBUTJAT">REBUTJAT (Sol·licitud denegada)</option>
                            <option value="BAIXA">BAIXA (Client Inactiu)</option>
                        </select>
                    </div>

                    <!-- Checkbox Client Premium (RF21/RF22) -->
                    <div class="form-group" style="grid-column: span 2;">
                        <label for="premium" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="checkbox"
                                   id="premium"
                                   th:field="*{premium}"
                                   style="width: auto;">
                            <span><strong>Client Premium (RF21/RF22)</strong> (Aplica descomptes en la fiança)</span>
                        </label>
                    </div>

                </div>

                <div class="button-group" style="margin-top: 24px;">
                    <button type="submit" class="btn btn-filter">
                        Desar Client
                    </button>

                    <a th:href="@{/web/usuaris/all}"
                       class="btn btn-cancel">
                        Cancel·lar
                    </a>
                </div>

            </form>

        </div>

    </main>
</div>

</body>
</html>
