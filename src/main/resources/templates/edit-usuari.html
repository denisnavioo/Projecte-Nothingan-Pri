<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulari Client</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <div class="d-flex" style="min-height: 100vh;">
        <!-- Menú Lateral Esquerre -->
        <div class="bg-dark text-white p-3" style="width: 250px;">
            <h4 class="mb-4">Projecte 1</h4>
            <ul class="nav flex-column gap-2">
                <li class="nav-item"><a th:href="@{/web/vehicles/all}" class="nav-link text-white-50">• Vehicles</a></li>
                <li class="nav-item"><a th:href="@{/web/reserves/all}" class="nav-link text-white-50">• Reserves</a></li>
                <li class="nav-item"><a th:href="@{/web/usuaris/all}" class="nav-link text-white fw-bold">• Clients</a></li>
            </ul>
        </div>

        <!-- Contingut Principal -->
        <div class="flex-grow-1 p-4">
            <!-- Capçalera -->
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
                <h2>Gestió de clients</h2>
                <div class="text-muted">(agent) ▾</div>
            </div>

            <div class="card shadow-sm p-4 style-container" style="max-width: 700px;">
                <h3 class="mb-4 text-primary">Formulari Client</h3>

                <!-- Formulari connectat amb Spring Boot -->
                <form th:action="@{/web/usuaris/save}" th:object="${usuari}" method="post">
                    
                    <!-- ID ocult per saber si creem o editem -->
                    <input type="hidden" th:field="*{id}" />

                    <div class="mb-3">
                        <label for="nom" class="form-label">Nom complet</label>
                        <input type="text" id="nom" th:field="*{nom}" class="form-control" required />
                    </div>

                    <div class="mb-3">
                        <label for="dni" class="form-label">DNI / NIE</label>
                        <input type="text" id="dni" th:field="*{dni}" class="form-control" required />
                    </div>

                    <div class="mb-3">
                        <label for="telefon" class="form-label">Telèfon</label>
                        <input type="tel" id="telefon" th:field="*{telefon}" class="form-control" />
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email (Usuari)</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control" required />
                    </div>

                    <!-- Secció Gestió de l'Estat del Registre (RF12/RF13) -->
                    <div class="mb-3">
                        <label for="estatRegistre" class="form-label"><strong>Estat del Registre (RF12/RF13):</strong></label>
                        <select id="estatRegistre" th:field="*{estatRegistre}" class="form-select">
                            <option value="PENDENT">PENDENT (Pendent de revisió)</option>
                            <option value="VALIDAT">VALIDAT (Aprovat / Donat d'alta)</option>
                            <option value="REBUTJAT">REBUTJAT (Sol·licitud denegada)</option>
                            <option value="BAIXA">BAIXA (Client Inactiu)</option>
                        </select>
                    </div>

                    <!-- Checkbox Client Premium (RF21/RF22) -->
                    <div class="mb-4 form-check">
                        <input type="checkbox" id="premium" th:field="*{premium}" class="form-check-input" />
                        <label for="premium" class="form-check-label">
                            <strong>Client Premium (RF21/RF22)</strong> (Aplica descomptes en la fiança)
                        </label>
                    </div>

                    <!-- Botons d'acció -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Desar Client</button>
                        <a th:href="@{/web/usuaris/all}" class="btn btn-secondary">Cancel·lar</a>
                    </div>

                </form>
            </div>
        </div>
    </div>

</body>
</html>
